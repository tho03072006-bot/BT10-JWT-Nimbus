spring.application.name=JWT_springboot3
server.port=8005
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Mac dinh: H2 trong bo nho, chay ngay khong can cai DB. Dung MySQL nhu bai giang: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:jwt_springboot3;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secret HS256 (chuoi Base64/hex >= 256 bit). CHI DUNG DEMO local, khi trien khai that phai dat bien moi truong JWT_SECRET.
security.jwt.secret-key=${JWT_SECRET:cfc955f2d49fe776a409c58f14461f6ab6d0ad9fda8edecbbb1267f8c682a9d4}
# 1h in millisecond
security.jwt.expiration-time=3600000

app.cors.allowed-origins=http://localhost:8005
